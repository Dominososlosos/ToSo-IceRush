name: Build Fabric mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build
        run: gradle build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ICE-RUSH-Fabric
          path: build/libs/*.jar

  server-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: ICE-RUSH-Fabric
          path: build/libs
      - name: Prepare Fabric 1.21.1 test server
        run: |
          mkdir -p server/mods
          cp build/libs/*.jar server/mods/
          curl -fsSL "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.18%2B1.21.1/fabric-api-0.116.18%2B1.21.1.jar" -o server/mods/fabric-api.jar
          curl -fsSL "https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.1/fabric-installer-1.0.1.jar" -o fabric-installer.jar
          cd server
          java -jar ../fabric-installer.jar server -mcversion 1.21.1 -loader 0.19.1 -downloadMinecraft
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\n' > server.properties
      - name: Boot dedicated server and verify mod commands
        run: |
          cd server
          set +e
          printf 'icerush status\nstop\n' | timeout 120s java -Xms1G -Xmx1G -jar fabric-server-launch.jar nogui
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Fabric server smoke test exited with status $status"
            cat logs/latest.log || true
            exit "$status"
          fi
          grep -q "ICE RUSH initialized" logs/latest.log
          grep -q "Stav: WAITING" logs/latest.log
          test -f config/icerush.json
